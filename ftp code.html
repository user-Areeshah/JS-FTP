<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body>
    <div class="converter-container">
        <h2>Currency Converter</h2>
      

        <div class="input-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" value="1" min="0">
        </div>

        <div class="input-group">
            <label for="fromCurrency">From:</label>
            <select id="fromCurrency">
                <option value="USD">USD - United States Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="PKR" selected>PKR - Pakistani Rupee</option>
                
            </select>
        </div>

        <div class="input-group">
            <label for="toCurrency">To:</label>
            <select id="toCurrency">
                <option value="USD">USD - United States Dollar</option>
                <option value="EUR" >EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="PKR" selected>PKR - Pakistani Rupee</option>
               
            </select>
        </div>

        <button id="convertBtn">Convert</button>

        <div class="result">
            <p>Converted Amount: <span id="convertedAmount">0.00</span></p>
        </div>

<footer>
  <p>Developer: Areeshah kashif</p>
</footer>

    </div>
    <script src="script.js"></script>
</body>
</html>
